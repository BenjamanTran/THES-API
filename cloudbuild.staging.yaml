# Staging: build + push API image, deploy to Cloud Run.
# Sensitive env vars should be set as substitution variables on the trigger.

substitutions:
  _REGION: asia-southeast1
  _API_BUILD_DIR: "."
  _AR_REPOSITORY: the-s-api-staging
  _CLOUD_RUN_SERVICE: the-s-api-staging
  _VPC_CONNECTOR: the-s-staging-connector
  _DB_HOST: ""
  _DB_USERNAME: ""
  _DB_PASSWORD: ""
  _DB_NAME: ""
  _RAILS_MASTER_KEY: ""
  _FE_ORIGIN: ""
  _COOKIE_DOMAIN: ""
  _REDIS_HOST: ""
  _SIDEKIQ_USERNAME: ""
  _SIDEKIQ_PASSWORD: ""
  _RESEND_API_KEY: ""
  _MAIL_FROM: "SmashHub <noreply@smashhub88.win>"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        docker build \
          -f "${_API_BUILD_DIR}/Dockerfile" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/api:${SHORT_SHA}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/api:staging-latest" \
          "${_API_BUILD_DIR}"

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/api

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        if gcloud run jobs describe the-s-api-migrate --region=${_REGION} &>/dev/null; then
          gcloud run jobs update the-s-api-migrate \
            --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/api:${SHORT_SHA} \
            --region=${_REGION} \
            --vpc-connector=${_VPC_CONNECTOR} \
            --set-env-vars=RAILS_ENV=staging,DB_HOST=${_DB_HOST},DB_USERNAME=${_DB_USERNAME},DB_PASSWORD=${_DB_PASSWORD},DB_NAME=${_DB_NAME},RAILS_MASTER_KEY=${_RAILS_MASTER_KEY} \
            --command=bundle,exec,rails,db:migrate
          gcloud run jobs execute the-s-api-migrate --region=${_REGION} --wait
        else
          gcloud run jobs create the-s-api-migrate \
            --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/api:${SHORT_SHA} \
            --region=${_REGION} \
            --vpc-connector=${_VPC_CONNECTOR} \
            --set-env-vars=RAILS_ENV=staging,DB_HOST=${_DB_HOST},DB_USERNAME=${_DB_USERNAME},DB_PASSWORD=${_DB_PASSWORD},DB_NAME=${_DB_NAME},RAILS_MASTER_KEY=${_RAILS_MASTER_KEY} \
            --command=bundle,exec,rails,db:migrate \
            --execute-now --wait
        fi

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - gcloud
      - run
      - deploy
      - ${_CLOUD_RUN_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/api:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --quiet
      - --port=3000
      - --vpc-connector=${_VPC_CONNECTOR}
      - --set-env-vars=RAILS_ENV=staging,DB_HOST=${_DB_HOST},DB_USERNAME=${_DB_USERNAME},DB_PASSWORD=${_DB_PASSWORD},DB_NAME=${_DB_NAME},RAILS_MASTER_KEY=${_RAILS_MASTER_KEY},FE_ORIGIN=${_FE_ORIGIN},COOKIE_DOMAIN=${_COOKIE_DOMAIN},REDIS_HOST=${_REDIS_HOST},SIDEKIQ_USERNAME=${_SIDEKIQ_USERNAME},SIDEKIQ_PASSWORD=${_SIDEKIQ_PASSWORD},RESEND_API_KEY=${_RESEND_API_KEY},MAIL_FROM=${_MAIL_FROM}
      - --command=./bin/start-with-sidekiq

  - id: cleanup-revisions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run revisions list \
          --service=${_CLOUD_RUN_SERVICE} \
          --region=${_REGION} \
          --format="value(REVISION)" \
          --sort-by=~creationTimestamp | tail -n +3 | while read -r rev; do
            echo "Deleting old revision: $${rev}"
            gcloud run revisions delete "$${rev}" --region=${_REGION} --quiet || true
          done

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/api:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/api:staging-latest
