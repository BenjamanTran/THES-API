---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/games":
    get:
      summary: List games
      tags:
      - Games
      description: List upcoming games with optional filters. Auth is optional — if X-User-Id is provided, fit_level is included.
      parameters:
      - name: X-User-Id
        in: header
        required: false
        description: Current user ID (optional, enables fit_level)
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: Page number (default 1)
        schema:
          type: integer
          default: 1
          example: 1
      - name: per_page
        in: query
        required: false
        description: Results per page (default 20, max 50)
        schema:
          type: integer
          default: 20
          maximum: 50
          example: 20
      - name: status
        in: query
        required: false
        description: Filter by game status
        schema:
          type: string
          enum:
          - open
          - full
          - ongoing
      - name: tier
        in: query
        required: false
        description: Filter games that match this tier
        schema:
          type: string
          enum:
          - newbie
          - beginner_plus
          - lower_intermediate
          - intermediate
          - upper_intermediate
          - advanced
          - semi_pro
          - professional
      - name: from_time
        in: query
        required: false
        description: Filter games starting from this time (ISO8601, default now)
        schema:
          type: string
          format: date-time
      - name: to_time
        in: query
        required: false
        description: Filter games starting before this time (ISO8601)
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: games listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        start_time:
                          type: string
                          format: date-time
                        end_time:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum:
                          - open
                          - full
                          - ongoing
                          - finished
                          - cancelled
                        players_count:
                          type: integer
                        max_players:
                          type: integer
                        fit_level:
                          type: string
                          nullable: true
                          enum:
                          - good
                          - warning
                          - hard
                          description: Only present when X-User-Id is provided
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
    post:
      summary: Create a game
      tags:
      - Games
      parameters:
      - name: X-User-Id
        in: header
        required: true
        description: Current user ID
        schema:
          type: integer
      responses:
        '201':
          description: game created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  start_time:
                    type: string
                    format: date-time
                  end_time:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum:
                    - open
                    - full
                    - ongoing
                    - finished
                    - cancelled
                  players_count:
                    type: integer
                  max_players:
                    type: integer
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start_time:
                  type: string
                  format: date-time
                  example: '2026-05-10T19:00:00Z'
                end_time:
                  type: string
                  format: date-time
                  example: '2026-05-10T20:00:00Z'
                lat:
                  type: number
                  format: float
                  example: 10.123
                lng:
                  type: number
                  format: float
                  example: 106.123
                match_type:
                  type: string
                  enum:
                  - singles
                  - doubles
                  example: doubles
                min_tier:
                  type: string
                  enum:
                  - newbie
                  - yeu
                  - yeu_plus
                  - trung_binh_yeu
                  - trung_binh_minus
                  - trung_binh_plus
                  - kha
                  - ban_chuyen
                  - chuyen_nghiep
                  example: beginner
                max_tier:
                  type: string
                  enum:
                  - newbie
                  - yeu
                  - yeu_plus
                  - trung_binh_yeu
                  - trung_binh_minus
                  - trung_binh_plus
                  - kha
                  - ban_chuyen
                  - chuyen_nghiep
                  example: advanced
                max_players:
                  type: integer
                  enum:
                  - 2
                  - 4
                  example: 4
              required:
              - start_time
              - end_time
              - match_type
              - max_players
  "/api/v1/games/{id}":
    get:
      summary: Get game detail
      tags:
      - Games
      description: Returns game detail including host and players list. Auth is optional — if X-User-Id is provided, fit_level context is available.
      parameters:
      - name: X-User-Id
        in: header
        required: false
        description: Current user ID (optional)
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: Game ID
        schema:
          type: integer
      responses:
        '200':
          description: game found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  start_time:
                    type: string
                    format: date-time
                  end_time:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum:
                    - open
                    - full
                    - ongoing
                    - finished
                    - cancelled
                  match_type:
                    type: string
                    enum:
                    - singles
                    - doubles
                  players_count:
                    type: integer
                  max_players:
                    type: integer
                  host:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
        '404':
          description: game not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/games/search":
    get:
      summary: Search games by location
      tags:
      - Games
      description: Search nearby games using Elasticsearch with geo distance, time, status, and tier filters. Sorted by relevance (distance + time). Falls back to SQL if ES is unavailable.
      parameters:
      - name: X-User-Id
        in: header
        required: false
        description: Current user ID (optional, enables tier filter and fit_level)
        schema:
          type: integer
      - name: lat
        in: query
        required: false
        description: Latitude of user location
        schema:
          type: number
          format: float
          example: 10.123
      - name: lng
        in: query
        required: false
        description: Longitude of user location
        schema:
          type: number
          format: float
          example: 106.123
      - name: radius
        in: query
        required: false
        description: Search radius (default 5km, max 20km)
        schema:
          type: string
          default: 5km
          example: 5km
      - name: tier
        in: query
        required: false
        description: Filter by tier (uses logged-in user tier if not provided)
        schema:
          type: string
          enum:
          - newbie
          - beginner_plus
          - lower_intermediate
          - intermediate
          - upper_intermediate
          - advanced
          - semi_pro
          - professional
      - name: from_time
        in: query
        required: false
        description: Filter games starting from this time (default now)
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        required: false
        description: Filter by game status
        schema:
          type: string
          enum:
          - open
          - full
          - ongoing
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 20
          maximum: 50
      responses:
        '200':
          description: search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        start_time:
                          type: string
                          format: date-time
                        end_time:
                          type: string
                          format: date-time
                        status:
                          type: string
                        players_count:
                          type: integer
                        max_players:
                          type: integer
                        distance_km:
                          type: number
                          format: float
                          nullable: true
                          description: Distance from search location in km
                        fit_level:
                          type: string
                          nullable: true
                          enum:
                          - good
                          - warning
                          - hard
  "/api/v1/games/{id}/join":
    post:
      summary: Join a game
      tags:
      - Games
      parameters:
      - name: X-User-Id
        in: header
        required: true
        description: Current user ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: Game ID
        schema:
          type: integer
      responses:
        '200':
          description: joined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: joined
                  warning:
                    type: string
                    nullable: true
                    example: This match may not fit your level
        '422':
          description: cannot join — game not open or already joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: time conflict with another game
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/games/{id}/leave":
    post:
      summary: Leave a game
      tags:
      - Games
      parameters:
      - name: X-User-Id
        in: header
        required: true
        description: Current user ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: Game ID
        schema:
          type: integer
      responses:
        '200':
          description: left successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: left
        '422':
          description: not in this game
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
servers:
- url: http://localhost:3000
  description: Local development
- url: http://34.126.72.131:3000
  description: Staging
